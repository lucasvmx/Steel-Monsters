name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            automake \
            build-essential \
            libasound2-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            xorg-dev

      - name: Build and install raylib 6.0
        run: |
          git clone --depth 1 --branch 6.0 https://github.com/raysan5/raylib.git raylib
          make -C raylib/src PLATFORM=PLATFORM_DESKTOP RAYLIB_LIBTYPE=SHARED
          sudo make -C raylib/src install RAYLIB_LIBTYPE=SHARED
          sudo ldconfig

      - name: Generate build system
        run: autoreconf --install

      - name: Configure
        run: |
          mkdir -p build
          cd build
          ../configure

      - name: Build
        run: make -C build
